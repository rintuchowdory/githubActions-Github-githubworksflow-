server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Try to serve file directly, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/json;
}
